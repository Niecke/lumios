[project]
name = "lumios-backend"
version = "0.3.0"
description = "Lumios photo library platform — backend API"
requires-python = "==3.14.*"
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "flask-sqlalchemy==3.1.1",
    "psycopg[binary]==3.3.6",
    "authlib==1.9.1",
    "requests==2.34.2",
    "cryptography==50.0.2",
    "Flask-Migrate==4.1.0",
    "argon2-cffi==25.1.0",
    "flask-talisman==1.1.0",
    "flask-wtf==1.3.0",
    "flask-session==0.8.0",
    "redis==8.1.0",
    "flask-limiter==4.1.1",
    "flask-cors==6.0.5",
    "Pillow==13.0.0",
    "piexif==1.1.3",
    "PyJWT==2.15.1",
    "boto3==1.43.118",
    "imageio-ffmpeg==0.6.0",
    "google-cloud-tasks==2.26.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-instrumentation-flask==0.66b1",
    "opentelemetry-exporter-gcp-trace==1.15.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[tool.ruff]
extend-exclude = ["app/migrations"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.uv]
package = false
