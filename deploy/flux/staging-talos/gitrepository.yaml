# A copy of the spec in ../base/gitrepository.yaml, not a reference to ../base:
# base/kustomization.yaml also brings in base/sync.yaml (lumios-flux, path
# ./deploy/flux), which would apply prod/ on this cluster. Keep the spec in step
# with the base file.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lumios
  namespace: lumios
spec:
  # The repository is public, so no secretRef: Flux clones it anonymously and
  # there is no deploy key to rotate.
  url: https://github.com/Niecke/lumios
  ref:
    branch: main
  interval: 1m
  ignore: |
    /*
    !/charts
    !/deploy
