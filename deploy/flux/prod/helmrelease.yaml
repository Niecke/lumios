apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lumios
  namespace: lumios
spec:
  interval: 5m
  # The released chart from GHCR, pinned in ocirepository.yaml — not
  # charts/lumios on main, which is staging's.
  chartRef:
    kind: OCIRepository
    name: lumios-chart
  # Without this, helm-controller only acts when the chart revision or the
  # values change, never on a live object being edited underneath it. Enabled,
  # the cluster is corrected back to the chart on every interval.
  driftDetection:
    mode: enabled
  # Longer than the 300 s deadline of the migrate hook Job (charts/lumios/
  # templates/migrate-job.yaml), so a slow migration is not cut off by Helm.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Credentials. This Secret is created once by hand and never lives in git —
  # see deploy/README.md. It carries the same YAML that a local
  # values-secrets.yaml would.
  valuesFrom:
    - kind: Secret
      name: lumios-values
      valuesKey: values.yaml
  # Inline values win over valuesFrom, so this is the deployment's own config.
  values:
    ingress:
      hosts:
        landingpage: lumios.niecke-it.de
        frontend: lumios-app.niecke-it.de
        backend: lumios-api.niecke-it.de
    backend:
      # Two pods so a rolling update never takes the API down. Migrations run
      # once per release in the migrate hook Job, so they cannot race.
      replicas: 2
      image:
        # Written by release.yml from a vX.Y.Z tag — a merge to main never
        # moves production. Rolling back is reverting that Deploy commit.
        tag: 0.2.0
    frontend:
      # Stateless nginx: two pods so a restart or a rolling update never takes
      # the app down. Both run on the one node, so this is not node redundancy.
      replicas: 2
      image:
        tag: 0.2.0
    landingpage:
      replicas: 2
      image:
        tag: 0.2.0
