services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: lumios-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - lumios_postgres_data:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-test:
    profiles: ["test"]
    image: docker.io/library/postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    container_name: lumios-postgres-test
    command: ["-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: lumios
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: lumios_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumios -d lumios_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    container_name: lumios-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  s3:
    image: docker.io/versity/versitygw:v1.9.0@sha256:57b45f18ff79cc2fc28aa6eb49920abd96be9786569842b7c5f783cc8ad5a1a4
    container_name: lumios-s3
    entrypoint: ["/bin/sh", "-ec", "mkdir -p /data/buckets /data/versions && exec /usr/local/bin/docker-entrypoint.sh"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/buckets
      VGW_VERSIONING_DIR: /data/versions
      VGW_HEALTH: /health
      VGW_QUIET: "true"
      VGW_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "7070:7070"   # S3 API
    volumes:
      - lumios_s3_data:/data:Z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  s3-init:
    image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    container_name: lumios-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ENDPOINT: http://s3:7070
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command: ["mkdir", "s3:${S3_BUCKET:-lumios}"]
    restart: "no"

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    container_name: lumios-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    restart: unless-stopped

  landingpage:
    build:
      context: landingpage/.
    environment:
      APP_URL: "http://localhost:8081"
      BACKEND_URL: "http://localhost:8080"
    container_name: lumios-landingpage
    ports:
      - "8082:8080"
    restart: unless-stopped

  backend:
    build: backend/.
    container_name: lumios-backend
    env_file: .env
    depends_on:
      s3-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app:Z
      - ./backend/pyproject.toml:/pyproject.toml:Z
      - ./backend/uv.lock:/uv.lock:Z
    #healthcheck:
    #  test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    #  interval: 15s
    #  timeout: 5s
    #  retries: 5
    #  start_period: 30s
    restart: unless-stopped

  # Background workers (Procrastinate): same image as the backend, one per pipeline.
  # The backend creates the queue tables (flask db upgrade), the workers wait for them.
  worker-default:
    build: backend/.
    container_name: lumios-worker-default
    env_file: .env
    command: ["worker", "--queue", "default", "--concurrency", "2"]
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
    volumes:
      - ./backend/app:/app:Z
    restart: unless-stopped

  worker-video:
    build: backend/.
    container_name: lumios-worker-video
    env_file: .env
    command: ["worker", "--queue", "video", "--concurrency", "1"]
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - backend
    volumes:
      - ./backend/app:/app:Z
    restart: unless-stopped

  frontend:
    build:
      context: frontend/.
    env_file: .env
    container_name: lumios-frontend
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_FRONTEND_CLIENT_ID:-}
      LANDING_URL: "http://localhost:8082"
      APP_URL: "http://localhost:8081"
      BACKEND_URL: "http://lumios-backend:8080"
      BACKEND_HOST: "lumios-backend"
      S3_ENDPOINT_URL: "http://localhost:7070"
    ports:
      - "8081:8080"
    #depends_on:
    #  backend:
    #    condition: service_healthy
    restart: unless-stopped

volumes:
  lumios_postgres_data:
  lumios_s3_data:
