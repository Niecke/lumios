name: CI

# Pull requests run the tests and build the images once, as multi-arch images
# tagged ci-<head sha7> in GHCR. Merging changes nothing about their contents, so
# promote.yml only retags them — no rebuild, and the digest that was tested is the
# digest that ships.
#
# Only pull_request, deliberately: while a PR is open, every push to its branch
# fires `synchronize` on the same commit, so a push trigger would run everything
# twice. workflow_dispatch runs the tests on demand.
on:
  pull_request:
    branches: [main, dev, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ghcr.io
  # GHCR rejects uppercase in a path, so this is not github.repository_owner.
  REGISTRY: ghcr.io/niecke/lumios

jobs:
  # A job-level `if:` on each consumer rather than a `paths:` filter on the
  # trigger: a workflow skipped by path filtering never reports its checks, so
  # required checks would sit Pending and the pull request could never merge. A
  # job skipped by `if:` reports `skipped`, which satisfies them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no pull request to diff — run everything.
          if [ -z "$BASE" ]; then
            echo "Manual run — nothing to filter on."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots compares against the merge base, so commits that landed
          # on the base branch while this pull request was open are not mistaken
          # for its own changes. Captured to a variable rather than piped:
          # `grep -q` exits early, and under pipefail the resulting SIGPIPE on
          # git would fail the step.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "$changed"

          if echo "$changed" | grep -qE '^(backend/|frontend/|landingpage/|\.github/workflows/(ci|backend-tests)\.yml)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Application code touched — running the full pipeline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No application code changed — tests and builds are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The sha under test. For a pull_request event github.sha is the ephemeral
  # merge commit, which no image should ever be tagged with — promote looks the
  # images up by the PR head sha after the merge.
  meta:
    name: Resolve build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      tag: ${{ steps.id.outputs.tag }}
      app_version: ${{ steps.id.outputs.app_version }}
    steps:
      # The manifest as the PR head has it, not the merge commit: on the release
      # pull request that is the version it is about to tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .release-please-manifest.json
          sparse-checkout-cone-mode: false

      # Images are built once, on the pull request, and promote only retags them
      # — so the release pull request's images are the ones that ship as that
      # release, and they carry the plain vX.Y.Z. Every other build is the last
      # release plus the commit it was built from.
      - id: id
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${COMMIT:0:7}" >> "$GITHUB_OUTPUT"

          version="v$(jq -r '."."' .release-please-manifest.json)"
          case "$HEAD_REF" in
            release-please--*) ;;
            *) version="$version-${COMMIT:0:7}" ;;
          esac
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "Images are tagged \`ci-${COMMIT:0:7}\` and report version \`$version\`." >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/backend-tests.yml

  build-backend:
    name: Build backend
    needs: [changes, meta, backend-tests]
    # A fork PR's GITHUB_TOKEN is read-only whatever this block asks for, and a
    # manual run has no PR head to tag images with — both fall back to running
    # the tests only.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ needs.meta.outputs.commit }}
          # image.source is what makes GHCR link the package to this repository.
          # Without it the package is owned by whoever pushed first and
          # GITHUB_TOKEN loses write access on the next run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/backend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    needs: [changes, meta]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Only the Vite client id is read from GCP; the images themselves live in
      # GHCR. WIF is used to read the secret, not to push anything.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Fetch Google Client ID
        id: secrets
        run: |
          CLIENT_ID=$(gcloud secrets versions access latest --secret=lumios-google-frontend-client-id)
          echo "::add-mask::${CLIENT_ID}"
          echo "google_client_id=${CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ steps.secrets.outputs.google_client_id }}
            VITE_LANDING_URL=https://lumios.niecke-it.de
            GIT_SHA=${{ needs.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/frontend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Built alongside the others so all three images always exist at the same
  # ci-<sha>: promote checks for the whole set before retagging any of it.
  build-landingpage:
    name: Build landingpage
    needs: [changes, meta]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: landingpage
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_URL=https://lumios-app.niecke-it.de
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/landingpage:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=landingpage
          cache-to: type=gha,mode=max,scope=landingpage
