name: CI

# Pull requests run the tests and build the images once, as multi-arch images
# tagged ci-<head sha40> in GHCR. Merging changes nothing about their contents, so
# promote.yml only retags them — no rebuild, and the digest that was tested is the
# digest that ships.
#
# Only pull_request, deliberately: while a PR is open, every push to its branch
# fires `synchronize` on the same commit, so a push trigger would run everything
# twice. workflow_dispatch runs the tests on demand.
on:
  pull_request:
    branches: [main, dev, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ghcr.io
  # GHCR rejects uppercase in a path, so this is not github.repository_owner.
  REGISTRY: ghcr.io/niecke/lumios

jobs:
  # A job-level `if:` on each consumer rather than a `paths:` filter on the
  # trigger: a workflow skipped by path filtering never reports its checks, so
  # required checks would sit Pending and the pull request could never merge. A
  # job skipped by `if:` reports `skipped`, which satisfies them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no pull request to diff — run everything.
          if [ -z "$BASE" ]; then
            echo "Manual run — nothing to filter on."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "chart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots compares against the merge base, so commits that landed
          # on the base branch while this pull request was open are not mistaken
          # for its own changes. Captured to a variable rather than piped:
          # `grep -q` exits early, and under pipefail the resulting SIGPIPE on
          # git would fail the step.
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "$changed"

          # The chart and the Flux manifests are checked on their own: a change
          # there needs no image build.
          if echo "$changed" | grep -qE '^(charts/|deploy/|\.github/workflows/ci\.yml)'; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -qE '^(backend/|frontend/|landingpage/|backup/|\.github/workflows/(ci|backend-tests)\.yml|\.release-please-manifest\.json)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Application code touched — running the full pipeline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No application code changed — tests and builds are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  helm-lint:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The chart has no default image tags and requires its secrets, so lint and
      # template need throwaway values — none of them reach a cluster.
      - name: Lint and render
        run: |
          set -euo pipefail
          # Preinstalled on ubuntu-latest, not pinned by us: fail loudly if gone.
          yq --version
          args=(
            --set backend.image.tag=ci
            --set frontend.image.tag=ci
            --set landingpage.image.tag=ci
            --set backup.image.tag=ci
            --set backup.database.gcs.accessKey=ci-db-key
            --set backup.database.gcs.secretKey=ci-db-secret
            --set backup.photos.gcs.accessKey=ci-photos-key
            --set backup.photos.gcs.secretKey=ci-photos-secret
            --set s3.endpointUrl=https://s3.example.invalid
            --set s3.accessKey=ci-s3-key
            --set s3.secretKey=ci-s3-secret
            --set postgres.password=ci-password
            --set redis.password=ci-redis-password
            --set backend.secretKey=ci-secret-key-ci-secret-key-ci-secret
            --set backend.jwtSecret=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
          )
          helm lint charts/lumios "${args[@]}"
          helm template lumios charts/lumios "${args[@]}" > "$RUNNER_TEMP/default.yaml"

          # The nginx workloads must stay non-root with a read-only root fs.
          for comp in frontend landingpage; do
            ok=$(yq -e "select(.kind == \"Deployment\" and .metadata.labels[\"app.kubernetes.io/component\"] == \"$comp\")
              | (.spec.template.spec.securityContext.runAsNonRoot == true
              and .spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem == true)" \
              "$RUNNER_TEMP/default.yaml")
            # The parentheses matter: without them yq reads `(select | A) and B` and
            # prints `false` for every other document too.
            # Not `| grep -q`: it exits early and yq dies of SIGPIPE under pipefail.
            [ "$ok" = true ]
          done

          # Both backups run as non-root with a read-only root fs and never
          # overlap.
          for comp in backup-database backup-photos; do
            ok=$(yq -e "select(.kind == \"CronJob\" and .metadata.labels[\"app.kubernetes.io/component\"] == \"$comp\")
              | (.spec.concurrencyPolicy == \"Forbid\"
              and .spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot == true
              and .spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem == true)" \
              "$RUNNER_TEMP/default.yaml")
            [ "$ok" = true ]
          done

          # The environments' own values, so a Flux edit that breaks the chart
          # fails here and not on the cluster. Staging turns the backups off,
          # production keeps them.
          for env in staging prod; do
            yq '.spec.values' "deploy/flux/$env/helmrelease.yaml" > "$RUNNER_TEMP/$env-values.yaml"
            helm template lumios charts/lumios -f "$RUNNER_TEMP/$env-values.yaml" \
              --set backup.database.gcs.accessKey=ci-db-key \
              --set backup.database.gcs.secretKey=ci-db-secret \
              --set backup.photos.gcs.accessKey=ci-photos-key \
              --set backup.photos.gcs.secretKey=ci-photos-secret \
              --set s3.endpointUrl=https://s3.example.invalid \
              --set s3.accessKey=ci-s3-key \
              --set s3.secretKey=ci-s3-secret \
              --set postgres.password=ci-password \
              --set redis.password=ci-redis-password \
              --set backend.secretKey=ci-secret-key-ci-secret-key-ci-secret \
              --set backend.jwtSecret=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret > "$RUNNER_TEMP/$env.yaml"
          done
          [ "$(grep -c 'component: backup-' "$RUNNER_TEMP/staging.yaml")" -eq 0 ]
          [ "$(grep -c 'kind: CronJob' "$RUNNER_TEMP/prod.yaml")" -eq 4 ]

  # The sha under test. For a pull_request event github.sha is the ephemeral
  # merge commit, which no image should ever be tagged with — promote looks the
  # images up by the PR head sha after the merge.
  meta:
    name: Resolve build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      tag: ${{ steps.id.outputs.tag }}
      app_version: ${{ steps.id.outputs.app_version }}
      built_at: ${{ steps.id.outputs.built_at }}
    steps:
      # The manifest as the PR head has it, not the merge commit: on the release
      # pull request that is the version it is about to tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .release-please-manifest.json
          sparse-checkout-cone-mode: false

      # Images are built once, on the pull request, and promote only retags them
      # — so the release pull request's images are the ones that ship as that
      # release, and they carry the plain vX.Y.Z. Every other build is the last
      # release plus the commit it was built from.
      - id: id
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

          version="v$(jq -r '."."' .release-please-manifest.json)"
          case "$HEAD_REF" in
            release-please--*) ;;
            *) version="$version-${COMMIT:0:7}" ;;
          esac
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "Images are tagged \`ci-${COMMIT}\` and report version \`$version\`." >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/backend-tests.yml

  build-backend:
    name: Build backend
    needs: [changes, meta, backend-tests]
    # A fork PR's GITHUB_TOKEN is read-only whatever this block asks for, and a
    # manual run has no PR head to tag images with — both fall back to running
    # the tests only.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.commit }}
            BUILD_TIMESTAMP=${{ needs.meta.outputs.built_at }}
          # image.source is what makes GHCR link the package to this repository.
          # Without it the package is owned by whoever pushed first and
          # GITHUB_TOKEN loses write access on the next run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/backend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend
    needs: [changes, meta]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.commit }}
            BUILD_TIMESTAMP=${{ needs.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/frontend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Built alongside the others so all four images always exist at the same
  # ci-<sha>: promote checks for the whole set before retagging any of it.
  build-landingpage:
    name: Build landingpage
    needs: [changes, meta]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: landingpage
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.commit }}
            BUILD_TIMESTAMP=${{ needs.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/landingpage:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=landingpage
          cache-to: type=gha,mode=max,scope=landingpage

  build-backup:
    name: Build backup
    needs: [changes, meta]
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backup
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.app_version }}
          tags: ${{ env.REGISTRY }}/backup:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
