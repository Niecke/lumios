name: Promote images

# The images were already built and tested on the pull request. Merging does not
# change their contents, so this only adds tags — no rebuild, and the digest that
# passed the integration test is exactly the digest that gets deployed.
on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      source_tag:
        description: "CI tag to promote (e.g. ci-abc1234)"
        required: true

permissions:
  # write only matters when DEPLOY_KEY is unset and the staging commit falls back
  # to GITHUB_TOKEN; with the deploy key the push goes over SSH — see checkout.
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: ghcr.io
  # GHCR rejects uppercase in a path, so this is not github.repository_owner.
  REGISTRY: ghcr.io/niecke/lumios

jobs:
  promote:
    name: Retag CI images
    # This workflow's own Deploy commit is a push to main too, and unlike a
    # GITHUB_TOKEN push, a deploy-key push does trigger workflows. It has no
    # pull request and no images, so skip it rather than fail on it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !(github.event.head_commit.author.email == '41898282+github-actions[bot]@users.noreply.github.com' &&
        startsWith(github.event.head_commit.message, 'Deploy '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # If main is protected by a ruleset that only lets pull requests in, the
      # GitHub Actions app cannot be exempted on a personal repository but a
      # deploy key can — so the checkout, and with it the push in the last step,
      # go over SSH with DEPLOY_KEY when that secret exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Empty when the secret is unset: checkout then falls back to GITHUB_TOKEN.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # The merge commit is a new sha, so main cannot name the CI images
      # directly: they are tagged with the sha of the PR head that was tested.
      - name: Find the tested images
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG_INPUT: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_TAG_INPUT" ]; then
            if ! [[ "$SOURCE_TAG_INPUT" =~ ^ci-[0-9a-f]{7}$ ]]; then
              echo "::error::source_tag must look like ci-abc1234."
              exit 1
            fi
            echo "tag=$SOURCE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].head.sha // empty')
          if [ -z "$head" ]; then
            # Merge commits keep the PR head as their second parent, which
            # covers a merge pushed without the API knowing about it.
            head=$(git rev-parse --verify --quiet "${{ github.sha }}^2" || true)
          fi
          if [ -z "$head" ]; then
            echo "::error::No pull request or merge parent found for ${{ github.sha }}." \
                 "Images are only built on pull requests — push to dev and open a PR" \
                 "instead of committing straight to main."
            exit 1
          fi
          echo "Promoting images built from $head"
          echo "tag=ci-${head:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ci.yml only builds images when application code changed, so a pull
      # request touching just workflows, Terraform or documentation merges
      # without ever producing a ci-<sha> tag. There is nothing to promote then.
      #
      # A build that genuinely failed cannot reach here: those are required
      # checks, so the pull request would not have been mergeable.
      - name: Check whether images were built for this commit
        id: images
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          missing=0
          for image in backend frontend landingpage; do
            if docker buildx imagetools inspect "$REGISTRY/$image:$SOURCE_TAG" >/dev/null 2>&1; then
              echo "found $image:$SOURCE_TAG"
            else
              echo "missing $image:$SOURCE_TAG"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No images tagged \`$SOURCE_TAG\` — ci.yml skipped the builds because no application code changed. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
          fi

      # imagetools copies the manifest by digest: same bytes, extra tag. No
      # `latest`: a floating tag under IfNotPresent lets two nodes hold two
      # different images under one name, and makes the rollback target ambiguous.
      - name: Tag with the main commit
        if: steps.images.outputs.exists == 'true'
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA:0:7}"
          for image in backend frontend landingpage; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:$tag" \
              "$REGISTRY/$image:$SOURCE_TAG"
            docker buildx imagetools inspect "$REGISTRY/$image:$tag" --format '{{.Manifest.Digest}}'
          done

      # Flux deploys whatever main says, so the sha that was just promoted has
      # to land in git. Nothing else moves it: the chart has no default tag, and
      # an unchanged manifest neither rolls the pods nor re-pulls the image.
      #
      # Staging only. Production (deploy/flux/prod/) is written by the release
      # workflow from a vX.Y.Z tag, never by a merge to main (#114).
      #
      # When promoting images on a release branch, skip updating staging so
      # staging continues to track main.
      #
      # The push goes over the deploy key from the checkout step. It does
      # re-trigger promote; the job-level `if:` skips that run.
      - name: Record the staging tag for Flux
        if: steps.images.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: deploy/flux/staging/helmrelease.yaml
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"

          # The Flux manifests arrive with #398; until then promotion is only the
          # retag above.
          if [ ! -f "$RELEASE" ]; then
            echo "::notice::$RELEASE does not exist yet — skipping the staging tag."
            exit 0
          fi

          TAG="sha-$short" yq -i '
            .spec.values.backend.image.tag = strenv(TAG) |
            .spec.values.frontend.image.tag = strenv(TAG) |
            .spec.values.landingpage.image.tag = strenv(TAG)
          ' "$RELEASE"

          if git diff --quiet -- "$RELEASE"; then
            echo "Already at $short — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE"
          git commit -m "Deploy $short to staging

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:main
