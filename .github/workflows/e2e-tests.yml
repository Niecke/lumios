name: Integration Tests (E2E)

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create .env for docker compose
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=lumios
          POSTGRES_PASSWORD=your_secure_password
          POSTGRES_DB=lumios
          SECRET_KEY=test-secret-key-at-least-32-chars-long!
          JWT_SECRET=test-jwt-secret-key-at-least-32-chars!!
          GOOGLE_FRONTEND_CLIENT_ID=
          EOF

      - name: Build and start backend + dependencies
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up --build -d postgres redis backend

      - name: Wait for backend to become healthy
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' lumios-backend 2>/dev/null || echo "missing")
            echo "  attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Backend did not become healthy in time."
              docker compose -f docker-compose.yml -f docker-compose.test.yml logs backend
              exit 1
            fi
            sleep 5
          done

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: e2e/package.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Run integration tests
        working-directory: e2e
        env:
          BACKEND_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs backend

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
