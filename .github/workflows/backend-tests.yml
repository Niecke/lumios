name: Backend Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: lumios
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lumios_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw
          --health-cmd "pg_isready -U lumios -d lumios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: backend
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group test

      - name: Check for unused imports and variables
        working-directory: backend
        run: uv run ruff check app/

      # Service containers cannot take a command override, so switch the
      # durability settings off at runtime (all three only need a reload).
      - name: Disable PostgreSQL durability
        run: |
          # Match on the published port, not the image: the image reference
          # changes when it is pinned by digest.
          cid=$(docker ps --filter publish=5432 --format '{{.ID}}' | head -n1)
          if [ -z "$cid" ]; then
            echo "::error::PostgreSQL service container not found (no container publishing port 5432)" >&2
            exit 1
          fi
          docker exec "$cid" psql -U lumios -d lumios_test \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lumios
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lumios_test
          SECRET_KEY: test-secret-key-at-least-32-chars-long!
          JWT_SECRET: test-jwt-secret-key-at-least-32-chars-long!
          DEBUG: "true"
          PASSWORD_HASHER_TIME_COST: "1"
          PASSWORD_HASHER_MEMORY_COST: "8"
          PASSWORD_HASHER_PARALLELISM: "1"
        run: uv run python -m pytest
