name: Docker — Backend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/backend-tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Resolve image tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          REPO="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lumios/backend"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${REPO}:${SHA},${REPO}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "tags=${REPO}:dev-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}:pr-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check platform pause state
        id: pause
        run: |
          PAUSED=$(grep -oP '^\s*paused\s*=\s*\K(true|false)' terraform/environments/prod/main.tf | head -1)
          if [ -z "$PAUSED" ]; then
            echo "::warning::Could not read local.paused from terraform/environments/prod/main.tf — assuming not paused."
            PAUSED=false
          fi
          echo "paused=${PAUSED}" >> "$GITHUB_OUTPUT"
          if [ "$PAUSED" = "true" ]; then
            echo "::notice::Lumios is paused (local.paused = true) — skipping deploy. The image was still built and pushed."
          fi

      - name: Authenticate to GCP
        if: steps.pause.outputs.paused != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        if: steps.pause.outputs.paused != 'true'
        run: |
          SHA=$(git rev-parse --short HEAD)
          gcloud run services update lumios-backend \
            --image=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lumios/backend:${SHA} \
            --region=europe-west1
