nameOverride: ""
fullnameOverride: ""

# PriorityClass for every pod the chart creates. Empty in production. Staging
# sets a negative one so that, when the shared node runs short of memory, the
# kubelet evicts staging pods before production.
priorityClassName: ""

# ---------------------------------------------------------------------------
# Database — a single-replica StatefulSet on a local-path PVC. The cluster is
# one node, so a second replica would land on the same disk and buy no
# availability. Restarts are therefore downtime; that is the accepted trade.
# ---------------------------------------------------------------------------
postgres:
  image: docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
  database: lumios
  username: lumios
  # Required. `openssl rand -base64 24`. Postgres sets it at first start only:
  # changing it later leaves the backend with a password the database rejects.
  password: ""
  storage:
    size: 10Gi
    # k3s' bundled provisioner, pointed at the dedicated data volume.
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Redis — server-side sessions and rate limiting. No persistence: a restart logs
# everybody out, which is cheaper than a volume to look after.
# ---------------------------------------------------------------------------
redis:
  image: docker.io/library/redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
  # Required. `openssl rand -hex 24`. Other pods on the node can reach the
  # Service, so Redis demands it (requirepass); the backend gets it via REDIS_URL.
  password: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# ---------------------------------------------------------------------------
# Object storage — any S3-compatible endpoint. Credentials go in the
# lumios-values Secret, not here.
# ---------------------------------------------------------------------------
s3:
  endpointUrl: ""
  # Reachable from the browser, for presigned URLs. Defaults to endpointUrl.
  publicEndpointUrl: ""
  bucket: lumios
  accessKey: ""
  secretKey: ""

# Error tracking. Off while the DSNs are empty. The backend DSN goes into the
# backend Secret, the frontend DSN is public (served in /config.js).
sentry:
  backendDsn: ""
  frontendDsn: ""
  # Defaults to the release namespace (lumios / lumios-staging).
  environment: ""
  tracesSampleRate: 0.0

backend:
  image:
    repository: ghcr.io/niecke/lumios/backend
    # Required, no default: set by promote.yml (staging) and release.yml (prod).
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Required. `openssl rand -hex 32` (min. 32 chars).
  secretKey: ""
  # Required. `openssl rand -hex 32` (min. 32 chars).
  jwtSecret: ""
  jwtExpirySeconds: 3600
  # entrypoint.py defaults to 2 * cpus + 1, which is far more than a shared
  # 2-vCPU node has memory for.
  gunicornWorkers: 2
  maxUsers: 100
  agbVersion: "1.0"
  google:
    clientId: ""
    # Not a secret: the frontend container serves it in /config.js. Used for
    # the frontend unless frontend.googleClientId is set.
    frontendClientId: ""
    clientSecret: ""
  mail:
    senderEmail: lumios@niecke-it.de
    senderName: Lumios
    adminEmail: ""
    # 0 disables the waitlist sync.
    waitlistListId: 0
    # Mail is off while this is empty.
    brevoApiKey: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  # Google client id served to the SPA at runtime; empty falls back to
  # backend.google.frontendClientId.
  googleClientId: ""
  image:
    repository: ghcr.io/niecke/lumios/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

landingpage:
  image:
    repository: ghcr.io/niecke/lumios/landingpage
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# ---------------------------------------------------------------------------
# Workers — background jobs (Procrastinate on PostgreSQL), one Deployment per
# pipeline on the backend image: `entrypoint.py worker --queue <name>`. Each has
# its own queue, concurrency and limits, so heavy work cannot starve light work.
#   default  short jobs; the stalled-job recovery runs here, keep it enabled
#   video    ffmpeg thumbnail extraction, one job at a time
#   photo    image thumbnails/previews: prepared, off until a follow-up moves them
# priorityClassName falls back to the chart-wide one.
# ---------------------------------------------------------------------------
workers:
  default:
    enabled: true
    replicas: 1
    concurrency: 4
    terminationGracePeriodSeconds: 30
    priorityClassName: ""
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
  video:
    enabled: true
    replicas: 1
    concurrency: 1
    # Room for the running ffmpeg job and the thumbnail upload.
    terminationGracePeriodSeconds: 120
    # A PriorityClass that must exist in the cluster (production:
    # deploy/flux/prod/priorityclass.yaml), below the backend and Postgres.
    priorityClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  photo:
    enabled: false
    replicas: 1
    concurrency: 2
    terminationGracePeriodSeconds: 30
    priorityClassName: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# ---------------------------------------------------------------------------
# Ingress — Traefik, with cert-manager issuing one certificate per host.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  hosts:
    landingpage: lumios.niecke-it.de
    frontend: lumios-app.niecke-it.de
    backend: lumios-api.niecke-it.de
  tls:
    enabled: true
    clusterIssuer: letsencrypt
  # Adds X-Robots-Tag: noindex to every host. Staging turns it on.
  noindex: false
  basicAuth:
    # Name of a Secret holding htpasswd lines under the key `users`, created by
    # hand. Applied to the landing page and the frontend, except the frontend's
    # /api/ path (proxied to the backend) and the backend host: the API
    # authenticates with a JWT in the Authorization header, the same header
    # basic auth uses, and the landing page calls it cross-origin.
    secretName: ""

# ---------------------------------------------------------------------------
# Migration — the Helm hook Job that runs `flask db upgrade` once per release,
# on the backend image. The backend pods themselves never migrate.
# ---------------------------------------------------------------------------
migration:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Cleanup — the flask maintenance commands, one CronJob each, on the backend
# image. Replaces the Cloud Scheduler + Cloud Run Job.
# ---------------------------------------------------------------------------
cleanup:
  enabled: true
  schedule: "0 2 * * *"
  timeZone: UTC
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# Backup — two off-site CronJobs on the backup/ image, each with its own Secret,
# HMAC key and healthchecks.io check (deploy/README.md, "Backup and disaster
# recovery"). The buckets and their keys are created in the infrastructure repo.
#   database  daily pg_dump | brotli, shipped as lumios-postgres-<TS>.tar
#   photos    rclone mirror of the object storage; the mode decides how deletes
#             reach the backup
# Staging turns the whole block off: its data is disposable.
# ---------------------------------------------------------------------------
backup:
  enabled: true
  image:
    repository: ghcr.io/niecke/lumios/backup
    # Required, no default: set by promote.yml (staging) and release.yml (prod).
    tag: ""
    pullPolicy: IfNotPresent
  gcs:
    # The S3-compatible (XML API) endpoint of GCS; the keys are HMAC keys.
    endpoint: https://storage.googleapis.com
  database:
    enabled: true
    schedule: "0 3 * * *"
    timeZone: Europe/Berlin
    # 5 rather than brotli's 11: the top levels cost minutes on a shared node.
    brotliQuality: 5
    # Scratch for the compressed dump (emptyDir).
    workDirSize: 2Gi
    activeDeadlineSeconds: 3600
    gcs:
      bucket: niecke-it-lumios-backups
      # Required. HMAC key of the database backup service account, which may add
      # and read archives but not delete them.
      accessKey: ""
      secretKey: ""
    # Optional but without it a failed or missing backup raises no alarm.
    # Ping URL of the healthchecks.io check; a secret, so it belongs in the
    # lumios-values Secret.
    healthcheckUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  photos:
    enabled: true
    schedule: "0 4 * * *"
    timeZone: Europe/Berlin
    # backup-dir | mirror | copy — how deletes in the object storage reach the
    # backup. See backup/backup-photos.sh and deploy/README.md for what each
    # needs from the bucket.
    mode: backup-dir
    transfers: 4
    activeDeadlineSeconds: 14400
    gcs:
      bucket: niecke-it-lumios-photo-backups
      # Required. A different key from the database backup's.
      accessKey: ""
      secretKey: ""
    healthcheckUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
