apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumios.fullname" . }}-landingpage
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: landingpage
spec:
  type: ClusterIP
  selector:
    {{- include "lumios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: landingpage
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumios.fullname" . }}-landingpage
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: landingpage
spec:
  replicas: {{ .Values.landingpage.replicas }}
  selector:
    matchLabels:
      {{- include "lumios.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: landingpage
  template:
    metadata:
      labels:
        {{- include "lumios.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: landingpage
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landingpage
          # Non-root nginx-unprivileged (UID 101) with a read-only root: the
          # entrypoint renders into the /tmp and /etc/nginx/conf.d emptyDirs.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "lumios.image" (list "landingpage" .Values.landingpage.image) | quote }}
          imagePullPolicy: {{ .Values.landingpage.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Substituted into index.html and registration.js at container
            # start, so the same image serves staging and production.
            - name: APP_VERSION
              value: {{ .Values.landingpage.image.tag | quote }}
            - name: APP_URL
              value: {{ printf "https://%s" .Values.ingress.hosts.frontend | quote }}
            - name: BACKEND_URL
              value: {{ printf "https://%s" .Values.ingress.hosts.backend | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.landingpage.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf-d
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf-d
          emptyDir: {}
