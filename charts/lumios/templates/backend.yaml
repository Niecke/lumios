{{- $pw := required "postgres.password is required — generate one with `openssl rand -base64 24`" .Values.postgres.password }}
{{- $secretKey := required "backend.secretKey is required — generate one with `openssl rand -hex 32`" .Values.backend.secretKey }}
{{- $jwt := required "backend.jwtSecret is required — generate one with `openssl rand -hex 32`" .Values.backend.jwtSecret }}
{{- $redisPw := required "redis.password is required — generate one with `openssl rand -hex 24`" .Values.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lumios.fullname" . }}-backend
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:6379/0" ($redisPw | urlquery) (include "lumios.redisHost" .) | quote }}
  {{- with .Values.s3.accessKey }}
  S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.s3.secretKey }}
  S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.readOnly.database.accessKey }}
  BACKUP_DATABASE_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.readOnly.database.secretKey }}
  BACKUP_DATABASE_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.readOnly.photos.accessKey }}
  BACKUP_PHOTOS_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backup.readOnly.photos.secretKey }}
  BACKUP_PHOTOS_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.mail.brevoApiKey }}
  BREVO_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.sentry.backendDsn }}
  SENTRY_DSN: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumios.fullname" . }}-backend
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "lumios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumios.fullname" . }}-backend
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "lumios.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "lumios.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Helm does not roll pods when only a referenced Secret changes, so a
        # rotated key would leave the running pods on the old one.
        checksum/credentials: {{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s" $pw $secretKey $jwt .Values.s3.accessKey .Values.s3.secretKey .Values.backend.mail.brevoApiKey .Values.backend.google.clientSecret .Values.backup.readOnly.database.accessKey .Values.backup.readOnly.database.secretKey .Values.backup.readOnly.photos.accessKey .Values.backup.readOnly.photos.secretKey | sha256sum }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        # UID 65532, created by useradd in backend/Dockerfile.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: {{ include "lumios.image" (list "backend" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "lumios.fullname" . }}-backend
          env:
            {{- include "lumios.backendEnv" . | nindent 12 }}
            # Migrations run once per release in the migrate-job.yaml hook, not
            # in every pod: two replicas would race on a rolling update.
            - name: RUN_MIGRATIONS
              value: "false"
          # entrypoint.py waits for the database and starts Gunicorn. It does
          # not migrate (RUN_MIGRATIONS=false): the migrate Job does (see
          # migrate-job.yaml), so on a first install the pod starts on the
          # empty schema and stays not ready until the Job has created it.
          #
          # The probes claim https: Talisman redirects plain-HTTP requests, and
          # the kubelet reaches the pod directly, not through Traefik.
          #
          # Readiness uses /health/ready: the database ping of /health plus a
          # schema at or past this code's head (not equal to it, so old pods stay
          # ready while an upgrade has already migrated). It returns 503 when the
          # database is unreachable or the schema is missing — right for pulling
          # the pod out of the Service and for failing Helm's wait, wrong for
          # liveness, where it would restart the backend in a loop and hide the
          # cause. Startup stays on /health and liveness on the socket, so a
          # missing schema never restarts the pod; the log names the missing
          # revisions.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            # Slack for a slow database start; the entrypoint waits for it.
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
