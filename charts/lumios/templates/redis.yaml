{{- $pw := required "redis.password is required — generate one with `openssl rand -hex 24`" .Values.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lumios.redisHost" . }}
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  REDIS_PASSWORD: {{ $pw | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumios.redisHost" . }}
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "lumios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumios.redisHost" . }}
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lumios.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      annotations:
        # Env vars are read at start: a new password must roll the pod.
        checksum/password: {{ sha256sum $pw | quote }}
      labels:
        {{- include "lumios.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.redis.image | quote }}
          # Sessions only — no RDB snapshots, no AOF, so nothing to write. The
          # password comes from the environment so it is not in the pod spec.
          command:
            - sh
            - -c
            - exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lumios.redisHost" . }}
                  key: REDIS_PASSWORD
            # Read by redis-cli, so the probes authenticate too.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "lumios.redisHost" . }}
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
