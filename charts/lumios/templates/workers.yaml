{{- /*
Background workers, one Deployment per enabled pipeline (default, video, photo).
Same image and credentials Secret as the backend, a different command. Jobs live
in PostgreSQL, so a worker restart loses nothing: a job it was running is picked
up again by the recovery task of the default worker (backend/app/worker.py).

Distroless: no shell, so the command is the interpreter itself. The probes are
HTTP, served by a tiny stdlib thread inside the worker process (port 8081, only
for the kubelet; no Service): an exec probe would start a second Python that
imports the app inside the pod's memory limit. /live asks whether the database
answered recently, not the worker loop: a worker that cannot reach PostgreSQL is
restarted, one that is merely busy is left alone. /ready also needs the schema
at or past the code's head, so a worker is not ready (and Helm's wait does not
finish) until the migration has run.
*/ -}}
{{- $pw := required "postgres.password is required — generate one with `openssl rand -base64 24`" .Values.postgres.password }}
{{- $secretKey := required "backend.secretKey is required — generate one with `openssl rand -hex 32`" .Values.backend.secretKey }}
{{- $jwt := required "backend.jwtSecret is required — generate one with `openssl rand -hex 32`" .Values.backend.jwtSecret }}
{{- range $name, $worker := .Values.workers }}
{{- if $worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumios.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "lumios.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $name }}
spec:
  replicas: {{ $worker.replicas }}
  selector:
    matchLabels:
      {{- include "lumios.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: worker-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "lumios.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: worker-{{ $name }}
      annotations:
        checksum/credentials: {{ printf "%s|%s|%s|%s|%s|%s|%s" $pw $secretKey $jwt $.Values.s3.accessKey $.Values.s3.secretKey $.Values.backend.mail.brevoApiKey $.Values.backend.google.clientSecret | sha256sum }}
    spec:
      {{- with (default $.Values.priorityClassName $worker.priorityClassName) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # A running job gets this long to finish when the pod is stopped.
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      securityContext:
        # The image's nonroot user (uid 65532).
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: {{ include "lumios.image" (list "backend" $.Values.backend.image) | quote }}
          imagePullPolicy: {{ $.Values.backend.image.pullPolicy }}
          command:
            - /usr/bin/python3
            - /entrypoint.py
            - worker
            - --queue
            - {{ $name | quote }}
            - --concurrency
            - {{ $worker.concurrency | quote }}
          envFrom:
            - secretRef:
                name: {{ include "lumios.fullname" $ }}-backend
          env:
            {{- include "lumios.backendEnv" $ | nindent 12 }}
            # Migrations belong to the migrate Job (install) and hook (upgrade).
            - name: RUN_MIGRATIONS
              value: "false"
          ports:
            - name: probe
              containerPort: 8081
          # Until the schema exists (first install: the migrate Job is still
          # running) the worker waits, not ready but alive: /live does not look
          # at the schema, so a missing schema never restarts the pod and the
          # log names the missing revisions. The startup probe gives the pod
          # time before liveness takes over.
          startupProbe:
            httpGet:
              path: /live
              port: probe
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: probe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: probe
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
{{- end }}
{{- end }}
