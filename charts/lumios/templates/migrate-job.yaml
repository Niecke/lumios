{{- /*
Schema migration, run once per release instead of in every backend pod.

entrypoint.py used to run `flask db upgrade` on each start, which races itself
as soon as a rolling update overlaps two pods. One Job per release cannot race.

Health depends on the schema: the backend is ready (/health/ready) and the
workers are ready (/ready of their probe server) only once the database holds
every revision their code knows. That is why a first install cannot use a
post-install hook. Helm runs a post-install hook only after --wait found every
resource ready (Flux waits by default), and the pods are not ready before the
hook has created the schema: it waits forever. Installs and upgrades differ:

- Install: a regular Job (`<release>-migrate-install`), rendered only while
  .Release.IsInstall. It is applied with the other resources, so it runs while
  Helm waits, and the wait is a real gate: a failed migration leaves the pods
  not ready and the install fails. It reads the regular backend Secret, which
  is applied together with it. Flux drift detection is off for it: a finished
  Job has immutable fields and Kubernetes adds others, nothing to correct. The
  next upgrade no longer renders it, and Helm deletes it. Its name differs from
  the hook Job's, so that delete never touches the hook.
- Upgrade: a pre-upgrade hook. It runs once before any new pod is created, a
  failed Job fails the release, and remediateLastFailure rolls it back while the
  old pods keep serving. The old pods stay ready on the migrated schema (the
  check is "at or past the head", not equality). A regular Job could not give
  this ordering: Helm would roll the new pods out next to it.

Not pre-install: on a first install PostgreSQL is part of this same release, so
a pre-install hook would run before any database exists. Both Jobs retry the
connection themselves (see `entrypoint.py migrate`) because they start as soon
as the StatefulSet exists, not when PostgreSQL accepts connections.

The hook carries its own Secret rather than reading the backend's. A
pre-upgrade hook runs before the release's regular manifests are applied, so on
a release that changes the backend Secret the Job would start against a Secret
that is not there yet. The lower hook weight orders this Secret ahead of the
Job. The app refuses to start without SECRET_KEY and JWT_SECRET, so they are
repeated, although a migration signs nothing.
*/ -}}
{{- $pw := required "postgres.password is required — generate one with `openssl rand -base64 24`" .Values.postgres.password }}
{{- $secretKey := required "backend.secretKey is required — generate one with `openssl rand -hex 32`" .Values.backend.secretKey }}
{{- $jwt := required "backend.jwtSecret is required — generate one with `openssl rand -hex 32`" .Values.backend.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lumios.fullname" . }}-migrate
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  JWT_SECRET: {{ $jwt | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lumios.fullname" . }}-migrate
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  {{- include "lumios.migrateJobSpec" (dict "root" . "secret" (printf "%s-migrate" (include "lumios.fullname" .)) "component" "migrate") | nindent 2 }}
{{- if .Release.IsInstall }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lumios.fullname" . }}-migrate-install
  labels:
    {{- include "lumios.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-install
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
spec:
  {{- include "lumios.migrateJobSpec" (dict "root" . "secret" (printf "%s-backend" (include "lumios.fullname" .)) "component" "migrate-install") | nindent 2 }}
{{- end }}
